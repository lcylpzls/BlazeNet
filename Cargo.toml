[workspace]
resolver = "3"
members = [
    "crates/blaze-common",
    "crates/producer",
    "crates/origin",
    "crates/scheduler",
    "crates/agent",
    "crates/relay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
fastcdc = "5.0"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
