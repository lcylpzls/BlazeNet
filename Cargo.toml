[workspace]
resolver = "3"
members = [
    "crates/blaze-proto",
    "crates/blaze-common",
    "crates/blaze-bench",
    "crates/producer",
    "crates/origin",
    "crates/scheduler",
    "crates/agent",
    "crates/relay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1.8"
compio = { version = "0.19", features = ["fs", "io"] }
fastcdc = "5.0"
iroh = "1.0.3"
iroh-relay = { version = "1.0.3", features = ["server", "test-utils"] }
rand = "0.9"
rand_chacha = "0.9"
redb = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.8"
