syntax = "proto3";

package blazenet.control;

// 节点 ↔ 调度中心：注册、心跳、任务流推送。
service Control {
  // 节点注册：返回节点 ID 与初始任务
  rpc Register(RegisterRequest) returns (RegisterReply);
  // 心跳：状态与摘要对账
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  // 任务流：长连接服务端推送，重连后先全量拉取
  rpc WatchTasks(TaskFilter) returns (stream TaskEvent);
  // 任务状态上报
  rpc ReportTask(TaskReport) returns (Empty);
  // 块完成上报：更新块账本
  rpc ReportChunk(ChunkDone) returns (Empty);
  // 查询候选源（含多 IP 地址）
  rpc QueryPeers(PeerQuery) returns (PeerList);
  // 查询版本清单
  rpc GetVersion(VersionQuery) returns (VersionInfo);
  // 原始节点提交版本后发布清单到调度中心
  rpc PublishVersion(PublishVersionRequest) returns (PublishVersionReply);
}

message RegisterRequest {
  string node_type = 1;
  string endpoint_id = 2;
  repeated Addr addrs = 3;
  string token = 4;
}

message RegisterReply {
  uint64 node_id = 1;
  string token = 2;
  repeated Task initial_tasks = 3;
}

message HeartbeatRequest {
  uint64 node_id = 1;
  string summary = 2;
}

message HeartbeatReply {
  uint64 server_time = 1;
  repeated uint64 task_ids = 2;
}

message TaskFilter {
  uint64 node_id = 1;
}

message TaskEvent {
  oneof ev {
    Task task = 1;
    TaskCancel cancel = 2;
  }
}

message Task {
  uint64 id = 1;
  uint64 game_id = 2;
  uint64 version = 3;
  enum Kind {
    DOWNLOAD = 0;
    UPDATE = 1;
    ROLLBACK = 2;
  }
  Kind kind = 4;
  repeated bytes assigned_chunks = 5;
}

message TaskCancel {
  uint64 task_id = 1;
  string reason = 2;
}

message TaskReport {
  uint64 node_id = 1;
  uint64 task_id = 2;
  string status = 3;
  string error = 4;
}

message ChunkDone {
  uint64 node_id = 1;
  uint64 game_id = 2;
  bytes chunk_hash = 3;
  uint32 size = 4;
}

message PeerQuery {
  uint64 game_id = 1;
  bytes chunk_hash = 2;
  uint32 limit = 3;
}

message Peer {
  uint64 node_id = 1;
  string endpoint_id = 2;
  repeated Addr addrs = 3;
  bool direct_only = 4;
}

message PeerList {
  repeated Peer peers = 1;
}

message Addr {
  string addr = 1;
  string kind = 2;
  string link = 3;
}

message VersionQuery {
  uint64 game_id = 1;
  uint64 version = 2;
}

message VersionInfo {
  bool found = 1;
  uint64 version = 2;
  bytes manifest = 3;
}

message PublishVersionRequest {
  uint64 game_id = 1;
  uint64 version = 2;
  bytes manifest = 3;
}

message PublishVersionReply {
  bool ok = 1;
  string error = 2;
}

message Empty {}
